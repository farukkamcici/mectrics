# XcodeGen project definition — `xcodegen generate` produces Mectrics.xcodeproj.
# This file is git-friendly and readable; the .xcodeproj is generated output (not in git).
#
# Signing: no Apple Developer Team ID is committed here. `DEVELOPMENT_TEAM` is filled from
# the MECTRICS_TEAM_ID environment variable when the project is generated:
#
#     export MECTRICS_TEAM_ID=YOURTEAMID   # put this in your shell profile
#     xcodegen generate
#
# Leave it unset to build unsigned (what CI does) — the setting then resolves to empty.
name: Mectrics

configs:
  Debug: debug
  Release: release
  # Release optimizations with testability enabled for deterministic microbenchmarks.
  Performance: release

options:
  bundleIdPrefix: com.mectrics
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  MetricsKit:
    path: Packages/MetricsKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    exactVersion: 1.8.2

targets:
  Mectrics:
    type: application
    platform: macOS
    sources:
      - path: Mectrics
        excludes:
          - Info.plist
      - path: MectricsShared
    dependencies:
      - package: MetricsKit
        product: MetricsKit
      - target: MectricsCLI
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: MectricsWidget
        embed: true
      - sdk: Security.framework
      - package: Sparkle
        product: Sparkle
    info:
      path: Mectrics/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Off until the user is asked. Turning it on changes only when the appcast is
        # fetched; system profiling stays off, so the request carries nothing about
        # this Mac beyond the version being checked.
        SUEnableAutomaticChecks: false
        SUEnableSystemProfiling: false
        SUFeedURL: https://raw.githubusercontent.com/farukkamcici/mectrics/main/appcast.xml
        SUPublicEDKey: 3waOnY63hGNluXrW0DoG+raMzWhoRH4gnvBW+KUG4qU=
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.mectrics.app
            CFBundleURLSchemes:
              - mectrics
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Mectrics"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mectrics.app
        PRODUCT_NAME: Mectrics
        MARKETING_VERSION: "1.6.0"
        CURRENT_PROJECT_VERSION: "8"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Mectrics"
        # i18n: English development region; extract localized strings into the catalog.
        DEVELOPMENT_LANGUAGE: en
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        REGISTER_APP_GROUPS: YES
        # Sandbox off for local IOKit access during development (hardened runtime at release).
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        Debug:
          DEVELOPMENT_TEAM: ${MECTRICS_TEAM_ID}
          CODE_SIGN_ENTITLEMENTS: Mectrics/Mectrics.entitlements
        Release:
          DEVELOPMENT_TEAM: ${MECTRICS_TEAM_ID}
          CODE_SIGN_ENTITLEMENTS: Mectrics/Mectrics.entitlements
          ENABLE_HARDENED_RUNTIME: YES
        Performance:
          DEVELOPMENT_TEAM: ${MECTRICS_TEAM_ID}
          CODE_SIGN_ENTITLEMENTS: Mectrics/Mectrics.entitlements
          ENABLE_HARDENED_RUNTIME: YES
          ENABLE_TESTABILITY: YES
          ENABLE_CODE_COVERAGE: NO

  MectricsWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: MectricsWidget
        excludes:
          - Info.plist
          - MectricsWidget.entitlements
      - path: MectricsShared
    dependencies:
      - package: MetricsKit
        product: MetricsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mectrics.app.widget
        PRODUCT_NAME: MectricsWidget
        MARKETING_VERSION: "1.6.0"
        CURRENT_PROJECT_VERSION: "8"
        INFOPLIST_FILE: MectricsWidget/Info.plist
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_LANGUAGE: en
        SWIFT_EMIT_LOC_STRINGS: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        REGISTER_APP_GROUPS: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          DEVELOPMENT_TEAM: ${MECTRICS_TEAM_ID}
          CODE_SIGN_ENTITLEMENTS: MectricsWidget/MectricsWidget.entitlements
          ENABLE_APP_SANDBOX: YES
        Release:
          DEVELOPMENT_TEAM: ${MECTRICS_TEAM_ID}
          CODE_SIGN_ENTITLEMENTS: MectricsWidget/MectricsWidget.entitlements
          ENABLE_APP_SANDBOX: YES
          ENABLE_HARDENED_RUNTIME: YES
        Performance:
          DEVELOPMENT_TEAM: ${MECTRICS_TEAM_ID}
          CODE_SIGN_ENTITLEMENTS: MectricsWidget/MectricsWidget.entitlements
          ENABLE_APP_SANDBOX: YES
          ENABLE_HARDENED_RUNTIME: YES

  MectricsCLI:
    type: tool
    platform: macOS
    sources:
      - path: Packages/MetricsKit/Sources/MectricsCLI
      - path: Packages/MetricsKit/Sources/MectricsCLICore
    dependencies:
      - package: MetricsKit
        product: MetricsKit
      - package: ArgumentParser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: mectrics
        # Keep the Swift module distinct from the case-insensitive app module output.
        # The executable filename remains the lowercase public command.
        PRODUCT_MODULE_NAME: MectricsCLI
        PRODUCT_BUNDLE_IDENTIFIER: com.mectrics.cli
        SWIFT_VERSION: "6.0"
        ENABLE_CODE_COVERAGE: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
      configs:
        Debug:
          DEVELOPMENT_TEAM: ${MECTRICS_TEAM_ID}
        Release:
          DEVELOPMENT_TEAM: ${MECTRICS_TEAM_ID}
          ENABLE_HARDENED_RUNTIME: YES
        Performance:
          DEVELOPMENT_TEAM: ${MECTRICS_TEAM_ID}
          ENABLE_HARDENED_RUNTIME: YES
          ENABLE_CODE_COVERAGE: NO

  MectricsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MectricsTests
    dependencies:
      - target: Mectrics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mectrics.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

schemes:
  Mectrics:
    build:
      targets:
        Mectrics: all
        MectricsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: MectricsTests
          parallelizable: false
    archive:
      config: Release
  MectricsPerformance:
    build:
      targets:
        Mectrics: all
        MectricsTests: [test]
    test:
      config: Performance
      gatherCoverageData: false
      targets:
        - name: MectricsTests
          parallelizable: false
